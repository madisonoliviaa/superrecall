apiVersion: v1
kind: Console
metadata:
  name: "SuperRecall — Workflow Memory"
spec:
  panels:
    - id: header
      type: markdown
      content:
        title: SuperRecall
        body: >
          ## Semantic Search for Workflow Issues


          Your team's collective ops memory. Log what went wrong, what fixed it,
          and search by **meaning** — not keywords.


          | Action | Description |

          | --- | --- |

          | **Log Fix** | Record a workflow issue + fix for the team |

          | **Search** | Semantic search across all past issues |

          | **Auto-capture** | Workflow failures are logged automatically |


          Built with [ChromaDB](https://www.trychroma.com/) for vector search
          and exposed via MCP for AI agent access.

    - id: issues-table
      type: table
      content:
        title: Logged Workflow Issues
        dataSource:
          kind: memory
          namespace: superrecall-issues
        render:
          kind: table
          columns:
            - field: service
              format: badge
              label: Service
            - field: environment
              format: badge
              label: Env
            - field: error_message
              format: text
              label: Error
            - field: workflow_name
              format: text
              label: Workflow
            - field: logged_at
              format: relative
              label: When
          rowActions:
            - label: Search Similar
              icon: search
              kind: trigger
              node: search-trigger
              template: search
              payload:
                query: "{{ error_message }}"
              variant: primary

    - id: log-panel
      type: markdown
      content:
        title: Quick Actions
        body: >
          ### Log a Fix


          Use the **Log Fix Manually** trigger to record a workflow issue and its fix.

          Once logged, the fix becomes searchable by the entire team — and by AI agents via MCP.


          ### Search Past Issues


          Use the **Search Issues** trigger to find similar past problems.

          SuperRecall uses **semantic search**: search for *"database won't connect"*

          and find entries about *"connection pool exhausted"* — same meaning, different words.

  layout:
    - i: header
      x: 0
      "y": 0
      w: 12
      h: 5
      minW: 4
      minH: 3
    - i: issues-table
      x: 0
      "y": 5
      w: 12
      h: 8
      minW: 6
      minH: 4
    - i: log-panel
      x: 0
      "y": 13
      w: 12
      h: 6
      minW: 4
      minH: 3
