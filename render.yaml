services:
  # Service 1: SuperRecall API (FastAPI + ChromaDB)
  - type: web
    name: superrecall-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

staticSites:
  # Service 2: SuperRecall Frontend
  - name: superrecall-frontend
    buildCommand: echo "ready"
    staticPublishPath: ./frontend
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
